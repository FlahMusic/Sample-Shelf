<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map Examples</title>
<style>
:root {
  --bg: #14161a; --panel: #1b1e23; --raise: #23272e; --line: #2c3038;
  --text: #f2f4f7; --dim: #bcc2cc; --faint: #8f96a1; --accent: #8fb8ff; --warn: #f2b672;
  --kick: #ff8a80; --snare: #f2b672; --hat: #c9a7ff; --loop: #9be7a8;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.4 "Segoe UI", system-ui, sans-serif; display: flex; flex-direction: column; }
header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header .brand { color: var(--dim); font-weight: 600; margin-right: 8px; }
.tab { background: var(--raise); border: 1px solid #353a43; color: var(--dim); border-radius: 999px; padding: 6px 14px; cursor: pointer; font: inherit; }
.tab.on { background: #2a3a55; border-color: #5574a6; color: var(--text); }
.note { color: var(--faint); font-size: 12.5px; margin-left: auto; }
.explain { padding: 10px 16px; color: var(--dim); background: var(--panel); border-bottom: 1px solid var(--line); font-size: 13.5px; }
.explain b { color: var(--text); font-weight: 600; }
.wrap { flex: 1; display: grid; grid-template-columns: 1fr 300px; min-height: 0; }
.stage { position: relative; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 8px; }
svg { width: 100%; height: 100%; max-height: calc(100vh - 140px); }
aside { background: var(--panel); border-left: 1px solid var(--line); padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
aside h3 { margin: 0; font-size: 12px; font-weight: 500; color: var(--faint); }
.sel { font-size: 15px; }
.sel small { display: block; color: var(--dim); font-size: 12.5px; margin-top: 2px; }
.list { display: grid; gap: 3px; }
.item { display: flex; justify-content: space-between; gap: 8px; padding: 5px 8px; border-radius: 6px; background: var(--bg); cursor: pointer; font-size: 13px; }
.item:hover { background: var(--raise); }
.item span:last-child { color: var(--dim); font-variant-numeric: tabular-nums; }
.ctrl { display: grid; gap: 8px; font-size: 13px; color: var(--dim); }
.ctrl label { display: flex; align-items: center; gap: 8px; }
.ctrl input[type=range] { flex: 1; accent-color: var(--accent); }
.ctrl input[type=checkbox] { accent-color: var(--accent); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--dim); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }
.empty { color: var(--faint); font-size: 13px; }
.tip { position: absolute; pointer-events: none; background: var(--raise); border: 1px solid var(--line); padding: 4px 8px; border-radius: 6px; font-size: 12.5px; white-space: nowrap; display: none; }
.dot { cursor: pointer; }
@media (max-width: 760px) { .wrap { grid-template-columns: 1fr; } aside { border-left: 0; border-top: 1px solid var(--line); } .note { margin-left: 0; } }
</style>
</head>
<body>
<header>
  <div class="brand">map examples</div>
  <button class="tab on" data-v="wheel">camelot wheel (option 1)</button>
  <button class="tab" data-v="sound">sound map + key/bpm links (option 3)</button>
  <div class="note">test sounds, not your library · no audio in this demo</div>
</header>
<div class="explain" id="explain"></div>
<div class="wrap">
  <div class="stage"><svg id="svg" viewBox="0 0 800 800"></svg><div class="tip" id="tip"></div></div>
  <aside>
    <div><h3>selected</h3><div class="sel" id="sel"><span class="empty">click a dot</span></div></div>
    <div class="ctrl" id="ctrl">
      <label>bpm range ± <input type="range" id="tol" min="1" max="15" value="6"><span id="tolv">6%</span></label>
      <label><input type="checkbox" id="hd" checked> half / double time counts</label>
    </div>
    <div><h3 id="listTitle">works with</h3><div class="list" id="list"></div></div>
    <div class="legend" id="legend"></div>
  </aside>
</div>

function camelot(p) {

  const ca = camelot(a), cb = camelot(b);

    const spread = (i - (arr.length - 1) / 2) * 0.07;
    const a = ang(c.n) + spread, r = bpmR(p.bpm, r0, r1);
    p.wx = CX + r * Math.cos(a); p.wy = CY + r * Math.sin(a);
  });
}

function drawWheel() {
  const sel = selected && selected.type === 'loop' ? selected : null;
  const selCam = sel && camelot(sel);
  for (let n = 1; n <= 12; n++) {
    for (const l of ['A', 'B']) {
      let hot = false, same = false;
      if (selCam) {
        const d = Math.min(Math.abs(selCam.n - n), 12 - Math.abs(selCam.n - n));
        same = d === 0 && l === selCam.l;
        hot = same || (d === 0) || (d === 1 && l === selCam.l);
      }
      el('path', { d: l === 'A' ? wedge(A_IN, A_OUT, n) : wedge(B_IN, B_OUT, n), fill: same ? '#2a3a55' : hot ? '#22304a' : (l === 'A' ? '#1a1d22' : '#1e2127'), stroke: css('--line'), 'stroke-width': 1 });
    }
    const a = ang(n);
    el('text', { x: CX + LABEL * Math.cos(a), y: CY + LABEL * Math.sin(a) + 5, fill: css('--dim'), 'font-size': 13, 'text-anchor': 'middle' }).textContent = `${n}B ${CAM_B[n - 1]}`;
    el('text', { x: CX + (A_IN - 22) * Math.cos(a), y: CY + (A_IN - 22) * Math.sin(a) + 4, fill: css('--faint'), 'font-size': 11, 'text-anchor': 'middle' }).textContent = `${n}A ${CAM_A[n - 1]}m`;
  }
  el('text', { x: CX, y: CY - 6, fill: css('--faint'), 'font-size': 12, 'text-anchor': 'middle' }).textContent = 'inner ring = minor';
  el('text', { x: CX, y: CY + 12, fill: css('--faint'), 'font-size': 12, 'text-anchor': 'middle' }).textContent = 'outer ring = major';
  el('text', { x: CX, y: CY + 30, fill: css('--faint'), 'font-size': 12, 'text-anchor': 'middle' }).textContent = 'further out = faster';
  const ms = sel ? matches(sel) : [];
  for (const m of ms) el('line', { x1: sel.wx, y1: sel.wy, x2: m.q.wx, y2: m.q.wy, stroke: css('--accent'), 'stroke-opacity': 0.55, 'stroke-width': 1.5 });
  const hit = new Set(ms.map((m) => m.q));
  for (const p of PTS) if (p.type === 'loop') {
    const isSel = p === sel;
    dot(p, p.wx, p.wy, isSel ? 8 : 6, isSel ? '#fff' : hit.has(p) ? css('--accent') : css('--loop'), { 'fill-opacity': sel && !isSel && !hit.has(p) ? 0.35 : 1, stroke: isSel ? css('--accent') : 'none', 'stroke-width': 3 });
  }
  return ms;
}

// ---------- option 3: sound map ----------
function placeSound() {
  const xs = PTS.map((p) => p.x), ys = PTS.map((p) => p.y);
  const [x0, x1, y0, y1] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
  const s = 680 / Math.max(x1 - x0, y1 - y0);
  for (const p of PTS) { p.sx = 60 + (p.x - x0) * s + (680 - (x1 - x0) * s) / 2; p.sy = 60 + (p.y - y0) * s + (680 - (y1 - y0) * s) / 2; }
}
function nearest(p, k) {
  return PTS.filter((q) => q !== p).map((q) => ({ q, d: Math.hypot(q.sx - p.sx, q.sy - p.sy) })).sort((a, b) => a.d - b.d).slice(0, k);
}
function drawSound() {
  const sel = selected;
  let ms = [];
  if (sel && sel.type === 'loop') {
    ms = matches(sel);
    for (const m of ms) el('line', { x1: sel.sx, y1: sel.sy, x2: m.q.sx, y2: m.q.sy, stroke: css('--accent'), 'stroke-opacity': 0.55, 'stroke-width': 1.5 });
  }
  const near = sel ? nearest(sel, 8) : [];
  const nearSet = new Set(near.map((n) => n.q));
  for (const n of near) el('circle', { cx: n.q.sx, cy: n.q.sy, r: 11, fill: 'none', stroke: '#fff', 'stroke-opacity': 0.5, 'stroke-width': 1 });
  const hit = new Set(ms.map((m) => m.q));
  for (const p of PTS) {
    const isSel = p === sel;
    const dim = sel && !isSel && !hit.has(p) && !nearSet.has(p);
    dot(p, p.sx, p.sy, isSel ? 8 : 5.5, isSel ? '#fff' : hit.has(p) ? css('--accent') : css('--' + p.type), { 'fill-opacity': dim ? 0.35 : 1, stroke: isSel ? css('--accent') : 'none', 'stroke-width': 3 });
  }
  return { ms, near };
}

// ---------- panel ----------
function item(label, right, p) {
  const d = document.createElement('div');
  d.className = 'item';
  d.innerHTML = '<span></span><span></span>';
  d.firstChild.textContent = label; d.lastChild.textContent = right;
  d.addEventListener('click', () => { selected = p; draw(); });
  return d;
}
function draw() {
  svg.replaceChildren();
  const list = document.getElementById('list');
  const selBox = document.getElementById('sel');
  list.replaceChildren();
  if (view === 'wheel') {
    const ms = drawWheel();
    document.getElementById('listTitle').textContent = 'works with (key + bpm)';
    if (selected && selected.type !== 'loop') selected = null;
    ms.forEach((m) => list.appendChild(item(m.q.name, `${camLabel(camelot(m.q))} · ${m.k}`, m.q)));
  } else {
    const { ms, near } = drawSound();
    document.getElementById('listTitle').textContent = selected && selected.type === 'loop' ? 'works with (key + bpm)' : 'sounds closest to this';
    if (selected && selected.type === 'loop') ms.forEach((m) => list.appendChild(item(m.q.name, m.k, m.q)));
    else near.forEach((n) => list.appendChild(item(n.q.name, n.q.type, n.q)));
  }
  if (!selected) { selBox.innerHTML = '<span class="empty">click a dot</span>'; }
  else {
    selBox.textContent = selected.name;
    const s = document.createElement('small');
    s.textContent = selected.type === 'loop' ? `${selected.bpm} bpm · ${keyName(selected)} · camelot ${camLabel(camelot(selected))}` : `${selected.type} · ${selected.len}s`;
    selBox.appendChild(s);
  }
  if (selected && !list.children.length) list.innerHTML = '<div class="empty">nothing in range. widen the bpm range.</div>';
  document.getElementById('ctrl').style.display = view === 'sound' && selected && selected.type !== 'loop' ? 'none' : '';
}

const EXPLAIN = {
  wheel: '<b>option 1.</b> every loop sits in its key\'s slot. click one: its slot plus the safe neighbours light up (same key, one step either side, relative major/minor) and lines go to loops that also fit the bpm range. one-shots have no tempo so they don\'t show here.',
  sound: '<b>option 3.</b> everything is placed by how it sounds, worked out from the audio alone, so kicks, snares and hats clump together. click a one-shot: the 8 closest sounds get a ring (swap material, like XO). click a loop: lines go to loops that fit by key + bpm, wherever they sit.',
};
const LEGEND = {
  wheel: [['--loop', 'loop'], ['--accent', 'works with selected']],
  sound: [['--kick', 'kick'], ['--snare', 'snare'], ['--hat', 'hat'], ['--loop', 'loop'], ['--accent', 'key/bpm match']],
};
function setView(v) {
  view = v; selected = null;
  document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('on', t.dataset.v === v));
  document.getElementById('explain').innerHTML = EXPLAIN[v];
  document.getElementById('legend').innerHTML = LEGEND[v].map(([c, l]) => `<span><i style="background:var(${c})"></i>${l}</span>`).join('');
  draw();
}
document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => setView(t.dataset.v)));
document.getElementById('tol').addEventListener('input', (e) => { document.getElementById('tolv').textContent = e.target.value + '%'; draw(); });
document.getElementById('hd').addEventListener('change', draw);
placeWheel(); placeSound(); setView('wheel');
</script>
</body>
</html>
